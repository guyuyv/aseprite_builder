name: Build and deploy Aseprite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
      - fix

permissions:
  contents: read

concurrency:
  group: aseprite-release
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  SKIA_VERSION: m124-08a5439a6b

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      download_url: ${{ steps.version.outputs.download_url }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          data="$(gh api repos/aseprite/aseprite/releases/latest)"

          latest_tag="$(jq -er '.tag_name' <<< "$data")"
          download_url="$(
            jq -er '
              [
                .assets[]
                | select(.name | test("source\\.zip$"; "i"))
              ][0].browser_download_url
            ' <<< "$data"
          )"
          release_notes="$(jq -r '.body // ""' <<< "$data")"

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"

          delimiter="RELEASE_NOTES_$(date +%s)_${RANDOM}"
          {
            echo "release_notes<<$delimiter"
            echo "$release_notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          release_exists=false
          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG}" \
            >/dev/null 2>&1; then
            release_exists=true
          fi

          should_build=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ||
                "$GITHUB_REF" == "refs/heads/fix" ||
                "$release_exists" != "true" ]]; then
            should_build=true
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"
          echo "Release already exists: $release_exists"
          echo "Build requested: $should_build"

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            ninja-build \
            p7zip-full \
            unzip \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prevent dynamic linkage to runner OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          ) | ForEach-Object {
            if (Test-Path $_) {
              Remove-Item $_ -Recurse -Force
            }
          }

      - name: Cache Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-${{ runner.os }}-${{ env.SKIA_VERSION }}

      - name: Download Skia (Ubuntu)
        if: runner.os == 'Linux' && steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --output Skia-Linux-Release-x64.zip \
            "https://github.com/aseprite/skia/releases/download/${SKIA_VERSION}/Skia-Linux-Release-x64.zip"

          rm -rf skia
          mkdir -p skia
          unzip -q Skia-Linux-Release-x64.zip -d skia
          test -d skia/out/Release-x64

      - name: Download Skia (Windows)
        if: runner.os == 'Windows' && steps.skia-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:GITHUB_WORKSPACE "Skia-Windows-Release-x64.zip"
          $skiaDir = Join-Path $env:GITHUB_WORKSPACE "skia"

          Invoke-WebRequest `
            -Uri "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/Skia-Windows-Release-x64.zip" `
            -OutFile $zip

          if (Test-Path $skiaDir) {
            Remove-Item $skiaDir -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $skiaDir -Force

          $skiaLibraryDir = Join-Path $skiaDir "out\Release-x64"
          if (-not (Test-Path $skiaLibraryDir)) {
            throw "Skia library directory was not found: $skiaLibraryDir"
          }

      - name: Download Aseprite source (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --output Aseprite-source.zip \
            "$DOWNLOAD_URL"

          temporary_dir="$(mktemp -d)"
          trap 'rm -rf "$temporary_dir"' EXIT
          unzip -q Aseprite-source.zip -d "$temporary_dir"

          source_dir="$(
            find "$temporary_dir" -type f -name CMakeLists.txt -printf '%d %h\n' \
              | sort -n \
              | sed -n '1{s/^[^ ]* //;p;}'
          )"

          test -n "$source_dir"
          test -f "$source_dir/CMakeLists.txt"

          rm -rf aseprite
          mkdir -p aseprite
          cp -a "$source_dir"/. aseprite/
          mkdir -p aseprite/build
          test -f aseprite/CMakeLists.txt

      - name: Download Aseprite source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:GITHUB_WORKSPACE "Aseprite-source.zip"
          $temporaryDir = Join-Path $env:RUNNER_TEMP "aseprite-source"
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "aseprite"

          Invoke-WebRequest -Uri $env:DOWNLOAD_URL -OutFile $zip

          if (Test-Path $temporaryDir) {
            Remove-Item $temporaryDir -Recurse -Force
          }
          if (Test-Path $sourceDir) {
            Remove-Item $sourceDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $temporaryDir -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $temporaryDir -Force

          $cmakeFile = Get-ChildItem `
            -Path $temporaryDir `
            -Recurse `
            -File `
            -Filter "CMakeLists.txt" |
            Sort-Object { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count } |
            Select-Object -First 1

          if ($null -eq $cmakeFile) {
            throw "CMakeLists.txt was not found in the Aseprite source archive"
          }

          $extractedSourceDir = $cmakeFile.Directory.FullName
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          Copy-Item `
            -Path (Join-Path $extractedSourceDir "*") `
            -Destination $sourceDir `
            -Recurse `
            -Force

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $sourceDir "build") `
            -Force | Out-Null

          if (-not (Test-Path (Join-Path $sourceDir "CMakeLists.txt"))) {
            throw "CMakeLists.txt was not copied to $sourceDir"
          }

      - name: Configure Aseprite (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: aseprite/build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath ../../skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath ../../skia/out/Release-x64)" \
            -G Ninja \
            ..

      - name: Configure Aseprite (Windows)
        if: runner.os == 'Windows'
        working-directory: aseprite/build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaDir = Convert-Path "../../skia"
          $skiaLibraryDir = Convert-Path "../../skia/out/Release-x64"

          cmake `
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
            "-DCMAKE_IGNORE_PATH=C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" `
            "-DLAF_BACKEND=skia" `
            "-DSKIA_DIR=$skiaDir" `
            "-DSKIA_LIBRARY_DIR=$skiaLibraryDir" `
            -G Ninja `
            ..

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build Aseprite (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: aseprite/build
        shell: bash
        run: |
          set -euo pipefail
          ninja aseprite

      - name: Build Aseprite (Windows)
        if: runner.os == 'Windows'
        working-directory: aseprite/build
        shell: pwsh
        run: |
          ninja aseprite
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja failed with exit code $LASTEXITCODE"
          }

      - name: Verify Windows executable starts
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\aseprite.exe --version
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Aseprite startup check failed with exit code $LASTEXITCODE"
          }

      - name: Prepare archive (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          LATEST_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          rm -f \
            gen \
            modp_b64_gen \
            gen.exe \
            gen.exe.manifest \
            modp_b64_gen.exe \
            modp_b64_gen.exe.manifest

          echo "# This file makes Aseprite behave as a portable program" > aseprite.ini
          7z a -tzip "Aseprite-${LATEST_TAG}-${RUNNER_OS}.zip" ./*

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: pwsh
        env:
          LATEST_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          @(
            "gen",
            "modp_b64_gen",
            "gen.exe",
            "gen.exe.manifest",
            "modp_b64_gen.exe",
            "modp_b64_gen.exe.manifest"
          ) | ForEach-Object {
            Remove-Item $_ -Force -ErrorAction SilentlyContinue
          }

          "# This file makes Aseprite behave as a portable program" |
            Set-Content -Path "aseprite.ini" -Encoding ascii

          $archive = "Aseprite-$env:LATEST_TAG-$env:RUNNER_OS.zip"
          7z a -tzip $archive .\*
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ runner.os }}
          path: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish draft release
    needs:
      - check-version
      - build-aseprite
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: aseprite-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ needs.check-version.outputs.latest_tag }}
          RELEASE_NOTES: ${{ needs.check-version.outputs.release_notes }}
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          if gh release view "$LATEST_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            gh release edit "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Aseprite $LATEST_TAG" \
              --notes-file release-notes.md

            gh release upload "$LATEST_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$LATEST_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Aseprite $LATEST_TAG" \
              --notes-file release-notes.md \
              --draft
          fi
