name: Build and deploy Aseprite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
      - fix

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Get latest version info
        id: version_info
        shell: bash
        run: |
          set -euo pipefail
          data=$(curl --fail --silent --show-error --location https://api.github.com/repos/aseprite/aseprite/releases/latest)
          LATEST_TAG=$(jq -r '.tag_name' <<< "$data")
          DOWNLOAD_URL=$(jq -r '.assets[] | select(.name | test("source\\.zip$"; "i")) | .browser_download_url' <<< "$data")
          VERSION_INFO=$(jq -r '.body' <<< "$data")
          test -n "$LATEST_TAG"
          test -n "$DOWNLOAD_URL"
          echo "$LATEST_TAG" > "${LATEST_TAG}.txt"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          {
            echo "version_info<<EOF"
            echo "$VERSION_INFO"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load version from cache
        id: version_check
        uses: actions/cache@v4
        with:
          path: ${{ steps.version_info.outputs.latest_tag }}.txt
          key: cached_version

      - name: Should we start new build?
        id: should_build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix' || steps.version_check.outputs.cache-hit != 'true'
        run: echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        if: steps.should_build.outputs.should_build
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_info.outputs.latest_tag }}
          release_name: Release Aseprite ${{ steps.version_info.outputs.latest_tag }}
          body: |
            ${{ steps.version_info.outputs.version_info }}
          draft: true
          prerelease: false

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: (Windows) Install dependencies
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: (Windows) Remove OpenSSL from PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Remove-Item -Recurse -Force 'C:\Program Files\OpenSSL\' -ErrorAction SilentlyContinue

      - name: (Ubuntu) Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip p7zip-full libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig-dev

      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-${{ matrix.os }}-cache

      - name: Download Skia if not in cache (Ubuntu)
        if: steps.skia-cache.outputs.cache-hit != 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location -o Skia-Linux-Release-X64.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          mkdir -p skia
          unzip -q Skia-Linux-Release-X64.zip -d skia

      - name: Download Skia if not in cache (Windows)
        if: steps.skia-cache.outputs.cache-hit != 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = 'Skia-Windows-Release-X64.zip'
          Invoke-WebRequest -Uri 'https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip' -OutFile $zip
          New-Item -ItemType Directory -Path skia -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath skia -Force

      - name: Download Aseprite release (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location -o Aseprite-source.zip '${{ needs.check-version.outputs.download_url }}'
          rm -rf aseprite
          unzip -q Aseprite-source.zip -d .
          mkdir -p aseprite/build

      - name: Download Aseprite release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Aseprite-source.zip'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'aseprite'
          Invoke-WebRequest -Uri '${{ needs.check-version.outputs.download_url }}' -OutFile $zip
          if (Test-Path $sourceDir) { Remove-Item $sourceDir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          New-Item -ItemType Directory -Path (Join-Path $sourceDir 'build') -Force | Out-Null

      - name: (Windows) Set architecture for the produced binary
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

      - name: (Windows) Set Visual Studio build environment variables and paths
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-vsdevenv@v4

      - name: (Windows) Run CMake
        if: matrix.os == 'windows-latest'
        working-directory: aseprite/build
        shell: pwsh
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} '-DCMAKE_IGNORE_PATH=C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/' -DLAF_BACKEND=skia -DSKIA_DIR="$(Convert-Path ../../skia)" -DSKIA_LIBRARY_DIR="$(Convert-Path ../../skia/out/Release-x64)" -G Ninja ..

      - name: (Ubuntu) Run CMake
        if: matrix.os == 'ubuntu-latest'
        working-directory: aseprite/build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DLAF_BACKEND=skia -DSKIA_DIR="$(realpath ../../skia)" -DSKIA_LIBRARY_DIR="$(realpath ../../skia/out/Release-x64)" -G Ninja ..

      - name: Run Ninja
        working-directory: aseprite/build
        shell: bash
        run: ninja aseprite

      - name: Clean up build
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest

      - name: Make portable
        working-directory: aseprite/build/bin
        shell: bash
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

      - name: Create release
        working-directory: aseprite/build/bin
        shell: bash
        run: 7z -tzip a "Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip" *

      - name: Upload release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.check-version.outputs.upload_url }}
          asset_path: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
          asset_content_type: application/zip
